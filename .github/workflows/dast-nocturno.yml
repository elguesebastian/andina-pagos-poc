name: DAST completo nocturno

on:
  schedule:
    - cron: "0 6 * * *"   # 03:00 de Argentina
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast-completo:
    name: DAST completo (ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar en Testing/Staging (contenedor de la POC)
        run: |
          docker build -t andina-poc:nocturno .
          docker run -d --name andina-poc -p 3000:3000 andina-poc:nocturno
          for i in $(seq 1 30); do curl -fs http://localhost:3000/health && break; sleep 2; done
      - name: Escaneo completo (activo)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py -t http://localhost:3000 -J zap-completo.json -r zap-completo.html -I
      - name: Evaluar alertas de riesgo alto
        run: node scripts/zap-gate.js zap/zap-completo.json
      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-dast-completo
          path: zap/
          retention-days: 90

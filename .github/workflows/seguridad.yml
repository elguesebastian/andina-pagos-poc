name: Pipeline con controles de seguridad

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Semgrep
        run: pip install "semgrep==1.182.1"
      - name: Analizar el código fuente
        run: |
          semgrep scan --config p/javascript --config .semgrep/ \
            --severity ERROR --error --metrics off \
            --sarif-output=semgrep.sarif
      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-sast
          path: semgrep.sarif
          retention-days: 90

  secretos:
    name: Escaneo de secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
      - name: Buscar secretos en el código y en el historial
        run: ./gitleaks detect --source . --redact --no-banner --report-format sarif --report-path gitleaks.sarif
      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-secretos
          path: gitleaks.sarif
          retention-days: 90

  sca:
    name: SCA y SBOM (Syft + Grype)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Generar el SBOM (CycloneDX)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" \
            anchore/syft:latest scan dir:/src -o cyclonedx-json=/src/sbom.cdx.json
      - name: Reporte de vulnerabilidades (SARIF)
        run: |
          mkdir -p "$RUNNER_TEMP/grype-db" "$RUNNER_TEMP/grype-tmp"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e GRYPE_DB_CACHE_DIR=/grype-db \
            -v "$RUNNER_TEMP/grype-db:/grype-db" -v "$RUNNER_TEMP/grype-tmp:/tmp" -v "$PWD:/src" \
            anchore/grype:latest sbom:/src/sbom.cdx.json -o sarif --file /src/grype.sarif
      - name: Bloquear si hay vulnerabilidades altas o críticas
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e GRYPE_DB_CACHE_DIR=/grype-db \
            -v "$RUNNER_TEMP/grype-db:/grype-db" -v "$RUNNER_TEMP/grype-tmp:/tmp" -v "$PWD:/src" \
            anchore/grype:latest sbom:/src/sbom.cdx.json --fail-on high
      - name: Verificar licencias
        run: node scripts/licencias.js sbom.cdx.json
      - name: Guardar el SBOM y el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-sca-y-sbom
          path: |
            sbom.cdx.json
            grype.sarif
          retention-days: 90

  build:
    name: Build y pruebas
    needs: [sast, secretos, sca]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Pruebas automatizadas
        run: npm test
      - name: Construir la imagen
        run: docker build -t andina-poc:${{ github.sha }} .

  dast:
    name: DAST base (ZAP)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar en Testing/Staging (contenedor de la POC)
        run: |
          docker build -t andina-poc:${{ github.sha }} .
          docker run -d --name andina-poc -p 3000:3000 andina-poc:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs http://localhost:3000/health && break; sleep 2; done
      - name: Escaneo base (pasivo)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -J zap-base.json -r zap-base.html -I
      - name: Bloquear si hay alertas de riesgo alto
        run: node scripts/zap-gate.js zap/zap-base.json
      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-dast-base
          path: zap/
          retention-days: 90

  aprobacion:
    name: Aprobación de la versión
    if: always()
    needs: [sast, secretos, sca, build, dast]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar los resultados de los controles
        run: |
          echo "SAST: ${{ needs.sast.result }}"
          echo "Secretos: ${{ needs.secretos.result }}"
          echo "SCA y SBOM: ${{ needs.sca.result }}"
          echo "Build y pruebas: ${{ needs.build.result }}"
          echo "DAST base: ${{ needs.dast.result }}"
          if [ "${{ needs.sast.result }}" != "success" ] || [ "${{ needs.secretos.result }}" != "success" ] || \
             [ "${{ needs.sca.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.dast.result }}" != "success" ]; then
            echo "VERSIÓN BLOQUEADA: al menos un control no se superó."
            exit 1
          fi
          echo "VERSIÓN APROBADA: superó todos los controles."
